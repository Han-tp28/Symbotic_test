robot:
  geometry:
    # Distance between the left and right drive-wheel contact planes [m].
    track_width: 0.50
    # Distance from the drive-wheel axle to each front/rear ball caster [m].
    wheelbase: 0.30
    wheel_radius: 0.15
    wheel_width: 0.06
    chassis_length: 0.80
    chassis_width: 0.60
    chassis_height: 0.25
    ground_clearance: 0.02
    caster_radius: 0.06

  dynamics:
    chassis_mass: 12.0
    wheel_mass: 1.0
    # Mass of each ball caster [kg].
    caster_mass: 0.25

  limits:
    max_linear_velocity: 5.0
    max_angular_velocity: 4.0
    max_linear_acceleration: 1.25
    max_linear_deceleration: 6.0
    max_angular_acceleration: 6.0

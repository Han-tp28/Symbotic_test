robot:
  geometry:
    # Physical geometry [m]. Changes require regenerating / respawning the model.
    wheel_radius: 0.15
    wheel_width: 0.06
    track_width: 0.50
    # Distance from the drive-wheel axle to each front/rear ball caster.
    wheelbase: 0.30
    chassis_length: 0.80
    chassis_width: 0.60
    chassis_height: 0.25
    ground_clearance: 0.02
    caster_radius: 0.06

  dynamics:
    chassis_mass: 12.0
    wheel_mass: 1.0
    caster_mass: 0.25

  controller:
    # Satisfies 0 -> 5 m/s within 5 s and 5 -> 0 m/s within 1 s.
    max_velocity: 5.0
    max_acceleration: 1.2
    max_deceleration: 6.0
    max_angular_velocity: 3.0
    max_angular_acceleration: 3.0
    max_angular_deceleration: 6.0
